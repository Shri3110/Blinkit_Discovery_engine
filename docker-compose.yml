version: '3.8'
services:
  db:
    image: postgres:15
    container_name: blinkit_db
    environment:
      POSTGRES_USER: blinkit_user
      POSTGRES_PASSWORD: blinkit_password
      POSTGRES_DB: discovery_engine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
